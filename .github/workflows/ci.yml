name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bedrock]"
      - name: Unit tests
        run: pytest -q
      - name: Validate suites
        run: |
          amb validate-suite suites/smoke
          amb validate-suite suites/core
      - name: Mock smoke run
        run: amb run --suite suites/smoke --llm mock --out runs
