queries:
  - id: q_drink_current
    tier: core
    category: update_awareness
    q: "What does Morgan prefer to drink?"
    gold:
      answers_any: ["coffee", "Coffee"]
      answers_forbidden_any: ["tea", "Tea"]
    citations:
      evidence_any:
        - must_include_any: ["coffee", "prefers coffee"]
      min_supporting_citations: 1
    shapes: [organized, verbatim]
    checks: [answer_match, citations_exist, citations_support]

